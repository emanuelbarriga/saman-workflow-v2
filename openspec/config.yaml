# openspec/config.yaml — SDD configuration for saman-workflow-v2
# Generated by sdd-init (2026-09-02). Mode: hybrid (openspec + Engram).

schema: spec-driven

context: |
  Tech stack: Python 3.14 dev env; pytest 9 as test runner; PySide6 available
  for the UI layer only. Blank V2 repo; code arrives via EXTRACTION from
  saman-nuke-tools (read-only source, no code copies yet).
  Architecture: SamanTools/core = pure logic only (NO nuke/PySide imports):
  rutas_engine (ShotGrid-style JSON profiles + tri-platform mapping +
  PROJECT_ROOT getenv relativization), entorno, nombres, limpiar.
  SamanTools/ui = sole PySide/Nuke layer (path_manager_panel Ctrl+Alt+O,
  export_panel Ctrl+Alt+E, review_breakdown_panel Ctrl+Alt+V, frame_manager,
  health_panel). SamanTools/vfxflow = core + panel_comentarios (Ctrl+Alt+C).
  render/ = distributed orchestrator (migrated later). bootstrap/menu.py
  (load contract, designed in first change) + bootstrap/installer.py (final
  phase). NO nuke/ folder at repo root (shadows Foundry's nuke module).
  Repo PUBLIC generic pipeline reference: no real studio absolute paths,
  no IPs; everything configured via external JSON profiles.
  Style: docstrings in Spanish, identifiers in English, conventional commits,
  SemVer (bootstrap/menu.py or SamanTools/__init__.py __version__).

rules:
  proposal:
    - "Repo is PUBLIC: never include secrets, tokens, personal paths, real
      studio absolute paths, or IPs."
    - Every change names its extraction source (module + path in
      saman-nuke-tools) or states it is new V2 code.
    - Migration changes are scoped to extraction; UI/installer work is separate.
  specs:
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY).
    - core/ modules MUST NOT import nuke or PySide — enforce with an import
      guard test (fail on 'import nuke'/'from PySide' in SamanTools/core).
    - Scenarios describe observable behavior in the existing test style.
    - Paths in scenarios are RELATIVE or profile-driven placeholders, never
      absolute studio paths.
  design:
    - Document architecture decisions with rationale.
    - "Layering: core/ is stdlib-only; ui/ imports core/ but core/ never
      imports ui/; vfxflow/core follows core/ rules."
    - Profile mapping and relativization must be injectable (no hardcoded
      roots beyond [getenv] PROJECT_ROOT semantics).
  tasks:
    - Group by phase, use hierarchical numbering.
    - Keep tasks completable in one session; every change keeps the suite green.
    - Extraction tasks ship module + its ported tests together (TDD).
  apply:
    guidelines:
      - Validate python3 -m py_compile on EVERY touched .py before commit.
      - "PROHIBITED in SamanTools/core, vfxflow/core and render/core logic:
        'import nuke', 'from PySide', 'import PySide'."
      - Docstrings in Spanish, identifiers in English.
      - Extraction copies the module and ports its tests; no silent renames.
    tdd: true
    test_command: "python3 -m pytest"
  verify:
    test_command: "python3 -m pytest"
    build_command: "python3 -m py_compile {touched_py_files}"
    coverage_threshold: 0
    coverage_notes: "Report real coverage only; never fake numbers. Strict TDD
      suite must pass before py_compile gate."
  archive:
    - Warn before merging destructive deltas.

testing:
  strict_tdd: true
  detected: 2026-09-02
  runner:
    command: "python3 -m pytest"
    framework: pytest 9.0.2 (Python 3.14.0)
    available: true
  layers:
    unit:
      available: true
      tool: "pytest (core); pytest + pytest-qt 4.5.0 for ui/ panels later"
    integration:
      available: false
      tool: null
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: "python3 -m pytest --cov"
    tool: "pytest-cov 7.0.0 / coverage 7.13.4"
  quality:
    linter:
      available: false
      tool: null
    type_checker:
      available: false
      tool: null
    formatter:
      available: false
      tool: null